[project]
name = "kb-studio"
version = "0.1.0"
description = "本地知识库客户端后端（FastAPI + LangChain + Chroma）"
readme = "README.md"
authors = [
    { name = "changliu35", email = "changliu35@iflytek.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kb-studio = "kb_studio:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
